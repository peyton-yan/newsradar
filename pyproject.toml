[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsradar"
version = "0.1.0"
description = "A-share macro news radar for Orange Pi 3B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "cryptography>=42,<46",
    "argon2-cffi>=23,<26",
    "itsdangerous>=2.1,<3",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/*",
    "migrations/*.py",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
